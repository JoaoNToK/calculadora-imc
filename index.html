<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Calculadora de IMC</h1>
    </header>

    <main>
      <section aria-label="formulário de cálculo">
        <form id="form-imc">
          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input
              type="number"
              id="peso"
              name="peso"
              placeholder="Ex: 70"
              required
            />
          </div>

          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input
              type="number"
              step="0.01"
              id="altura"
              name="altura"
              placeholder="Ex: 1.75"
              required
            />
          </div>

          <button type="submit">Calcular IMC</button>
        </form>

        <article id="resultado" aria-live="polite"></article>
      </section>
    </main>

    <footer>
      <p>Desenvolvido por João • Estudo de Desenvolvimento Web</p>
    </footer>

    <script src="/script.js"></script>
  </body>
</html>
